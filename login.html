<!DOCTYPE html>
<html>
<head>
    <title>Faculty Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Poppins',sans-serif; background:#f2f4f8; display:flex; justify-content:center; align-items:center; height:100vh; }
        .login-box { background:white; padding:30px; border-radius:12px; box-shadow:0 6px 15px rgba(0,0,0,0.1); width:400px; }
        h2 { text-align:center; margin-bottom:20px; }
        input, select { width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid #ccc; }
        button { width:100%; padding:10px; border:none; border-radius:8px; background:#2c7be5; color:white; font-weight:600; cursor:pointer; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Faculty Login</h2>
    <form method="POST">
        <input type="text" name="name" placeholder="Faculty Name" required>
        <input type="text" name="subject" placeholder="Subject" required>

        <select name="branch" required>
            <option value="" disabled selected>Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="MECH">MECH</option>
            <option value="CIVIL">CIVIL</option>
        </select>

        <select name="year" required>
            <option value="" disabled selected>Select Year</option>
            <option value="I">I</option>
            <option value="II">II</option>
            <option value="III">III</option>
            <option value="IV">IV</option>
        </select>

        <select name="sem" required>
            <option value="" disabled selected>Select Sem</option>
            <option value="I">I</option>
            <option value="II">II</option>
        </select>

        <select name="section" required>
            <option value="" disabled selected>Select Section</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
        </select>

        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
